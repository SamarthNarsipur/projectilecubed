<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Projectile Kinematics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #05050a;
            color: #00ffcc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: auto 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1300px;
        }

        .panel {
            background: linear-gradient(135deg, #0b0b1e 0%, #12122c 100%);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .controls-panel {
            grid-column: 1;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h3, h4 {
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed #ff007f;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #00ffcc;
            font-weight: bold;
        }

        input {
            background-color: #05050a;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            padding: 10px;
            color: #ffff00;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 255, 204, 0.5);
        }

        input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        button {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #ff007f;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #ff007f, 0 0 30px #7928ca;
        }

        .dashboard-panel {
            grid-column: 2;
            grid-row: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 15px 20px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #8892b0;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffff00;
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
        }

        .simulation-arena {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 25px;
        }

        canvas {
            background-color: #020208;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            border-radius: 12px;
            width: 100%;
            height: 480px;
        }

        #fbdCanvas {
            background-color: #020208;
            border: 1px solid #7928ca;
            box-shadow: 0 0 10px rgba(121, 40, 202, 0.2);
            width: 100%;
            height: 420px;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            font-size: 1.2rem;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>// QUANTUM PROJECTILE KINEMATICS</h1>

    <div class="container">
        <div class="panel controls-panel">
            <h3>System Inputs</h3>
            <div class="input-group">
                <label>V₀ (Initial Velocity - m/s)</label>
                <input type="number" id="velocity" value="60" min="1" max="120">
            </div>
            <div class="input-group">
                <label>θ (Launch Angle - Degrees)</label>
                <input type="number" id="theta" value="45" min="0" max="90">
            </div>
            <button id="launchBtn">COMPUTE & LAUNCH</button>
        </div>

        <div class="panel dashboard-panel">
            <div class="metric">
                <span class="metric-label">t (Flight Time)</span>
                <span id="metric-time" class="metric-value">0.00 s</span>
            </div>
            <div class="metric">
                <span class="metric-label">Δx (Live Range)</span>
                <span id="metric-range" class="metric-value">0.00 m</span>
            </div>
            <div class="metric">
                <span class="metric-label">Δy (Live Altitude)</span>
                <span id="metric-altitude" class="metric-value">0.00 m</span>
            </div>
            <div class="metric">
                <span class="metric-label">R_max (Theoretical)</span>
                <span id="metric-max-range" class="metric-value">0.00 m</span>
            </div>
        </div>

        <div class="simulation-arena">
            <canvas id="simCanvas"></canvas>
            <div class="panel" style="display: flex; flex-direction: column; justify-content: space-between;">
                <h4>Vector FBD Mode</h4>
                <canvas id="fbdCanvas"></canvas>
            </div>
        </div>
    </div>

    <footer>made by sam :)</footer>

    <script src="script.js"></script>
</body>
</html>
